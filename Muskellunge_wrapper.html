<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<style>body{background-color:transparent;}</style>

  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Muskellunge Species Map</title>
  <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: transparent;
        font-family: Arial, sans-serif;
      }

      #wrap {
        width: 100%;
        height: 100vh;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        background: transparent;
      }

      #panel-frame {
        width: 100%;
        border: none;
        display: block;
        flex: 0 0 auto;
      }

      #map-frame {
        width: 100%;
        border: none;
        display: block;
        flex: 1 1 auto;
        min-height: 0;
      }

      #data-frame {
        width: 100%;
        border: none;
        display: block;
        flex: 0 0 180px;
        height: 180px;
      }

      @media (max-width: 700px) {
        #data-frame {
          flex: 0 0 220px;
          height: 220px;
        }
      }
    </style>
  <script>
      function setPanelHeight(h) {
        var panel = document.getElementById('panel-frame');
        if (!panel) return;
        panel.style.height = Math.max(120, h) + 'px';
      }

      function forwardToMap(msg) {
        var f = document.getElementById('map-frame');
        if (f && f.contentWindow) f.contentWindow.postMessage(msg, '*');
      }

      function forwardToData(msg) {
        var f = document.getElementById('data-frame');
        if (f && f.contentWindow) f.contentWindow.postMessage(msg, '*');
      }

      window.addEventListener('message', function(event) {
        if (!event.data || !event.data.type) return;
        var msg = event.data;

        if (msg.type === 'musky_panel_height') {
          setPanelHeight(msg.height);
          return;
        }

        if (msg.type === 'musky_waterbody_selected') {
          forwardToMap(msg);
          forwardToData(msg);
          return;
        }

        if (msg.type === 'musky_reset_request') {
          forwardToMap(msg);
          forwardToData(msg);
          return;
        }
      });

      window.addEventListener('load', function() {
        setPanelHeight(230);
      });
    </script>
</head>
<html>
  <body>
    <div id="wrap">
      <iframe id="panel-frame" src="Muskellunge_panel.html" scrolling="no"></iframe>
      <iframe id="map-frame" src="Muskellunge_map.html"></iframe>
      <iframe id="data-frame" src="Muskellunge_data.html" scrolling="no"></iframe>
    </div>
  </body>
</html>
</html>
