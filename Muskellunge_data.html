<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<style>body{background-color:transparent;}</style>

  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Muskellunge Data Panel</title>
  <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        background: transparent;
        font-family: Arial, sans-serif;
        overflow-x: hidden;
      }

      * { box-sizing: border-box; }

      #data-wrap {
        width: 100%;
        padding: 0;
      }

      #data-card {
        background: linear-gradient(to bottom, rgba(255,255,255,0.97), rgba(248,250,248,0.97));
        border-top: 1px solid #d9e2da;
        border-bottom: 1px solid #d9e2da;
        box-shadow: 0 -1px 6px rgba(0,0,0,0.04);
        padding: 12px 14px 14px 14px;
        width: 100%;
      }

      #data-title {
        font-size: 15px;
        font-weight: 700;
        color: #24507f;
        margin: 0 0 10px 0;
      }

      #data-empty {
        color: #5d6f81;
        font-size: 13px;
        line-height: 1.4;
        padding: 4px 0 2px 0;
      }

      #data-content {
        display: none;
      }

      #data-content.active {
        display: block;
      }

      .panel-view {
        display: none;
      }

      .panel-view.active {
        display: block;
      }

      #selected-row,
      #length-top-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        flex-wrap: wrap;
        margin: 0 0 10px 0;
      }

      #selected-waterbody,
      #length-waterbody {
        font-size: 22px;
        font-weight: 700;
        color: #1f3f73;
        line-height: 1.15;
        margin: 0;
      }

      #length-btn,
      #back-btn {
        display: none;
        border: 1px solid #d4e4f2;
        background: #eef5fb;
        color: #24507f;
        border-radius: 6px;
        padding: 8px 12px;
        font-size: 13px;
        font-weight: 700;
        cursor: pointer;
        white-space: nowrap;
      }

      #length-btn:hover,
      #back-btn:hover {
        background: #e6f0f8;
      }

      .data-grid {
        display: grid;
        grid-template-columns: 170px 1fr;
        gap: 0;
        border: 1px solid #dbe6ef;
        border-radius: 7px;
        overflow: hidden;
        background: #fff;
      }

      .data-key,
      .data-val {
        padding: 10px 12px;
        font-size: 13px;
        line-height: 1.35;
        border-bottom: 1px solid #e8eef4;
      }

      .data-key {
        font-weight: 700;
        color: #355372;
        background: #f6f9fc;
        border-right: 1px solid #e8eef4;
      }

      .data-val {
        color: #32485d;
        background: #ffffff;
        word-break: break-word;
      }

      .data-grid > div:nth-last-child(-n+2) {
        border-bottom: none;
      }

      .pill {
        display: inline-block;
        padding: 4px 9px;
        border-radius: 999px;
        font-size: 12px;
        font-weight: 700;
        background: #eef5fb;
        color: #24507f;
        border: 1px solid #d4e4f2;
      }

      #length-wrap {
        margin-top: 6px;
        padding: 12px;
        background: #ffffff;
        border: 1px solid #dbe6ef;
        border-radius: 8px;
      }

      #length-msg {
        display: none;
        color: #5d6f81;
        font-size: 13px;
        line-height: 1.4;
      }

      #length-chart-title {
        font-size: 15px;
        font-weight: 700;
        color: #1f3f73;
        margin: 0 0 10px 0;
      }

      #length-chart-host {
        width: 100%;
        overflow-x: auto;
      }

      #length-chart-svg {
        width: 100%;
        height: auto;
        display: block;
      }

      @media (max-width: 700px) {
        #data-card {
          padding: 10px;
        }

        #data-title {
          font-size: 14px;
          margin-bottom: 8px;
        }

        #selected-waterbody,
        #length-waterbody {
          font-size: 18px;
        }

        #length-btn,
        #back-btn {
          font-size: 12px;
          padding: 7px 10px;
        }

        .data-grid {
          grid-template-columns: 1fr;
          border-radius: 5px;
        }

        .data-key {
          border-right: none;
          border-bottom: none;
          padding-bottom: 4px;
        }

        .data-val {
          padding-top: 0;
        }

        #length-wrap {
          padding: 10px;
        }
      }
    </style>
  <script>

"bin_left":84,"bin_right":85,"count":4,"percent":1.2195},{"bin_left":85,"bin_right":86,"count":10,"percent":1.2195},{"bin_left":86,"bin_right":87,"count":8,"percent":1.2195},{"bin_left":87,"bin_right":88,"count":4,"percent":1.2195},{"bin_left":88,"bin_right":89,"count":5,"percent":1.2195},{"bin_left":89,"bin_right":90,"count":3,"percent":1.2195},{"bin_left":90,"bin_right":91,"count":5,"percent":1.2195},{"bin_left":91,"bin_right":92,"count":3,"percent":1.2195},{"bin_left":92,"bin_right":93,"count":5,"percent":1.2195},{"bin_left":94,"bin_right":95,"count":1,"percent":1.2195},{"bin_left":95,"bin_right":96,"count":3,"percent":1.2195},{"bin_left":97,"bin_right":98,"count":7,"percent":1.2195},{"bin_left":98,"bin_right":99,"count":3,"percent":1.2195},{"bin_left":99,"bin_right":100,"count":3,"percent":1.2195},{"bin_left":100,"bin_right":101,"count":5,"percent":1.2195},{"bin_left":101,"bin_right":102,"count":6,"percent":1.2195},{"bin_left":102,"bin_right":103,"count":3,"percent":1.2195},{"bin_left":103,"bin_right":104,"count":5,"percent":1.2195},{"bin_left":104,"bin_right":105,"count":4,"percent":1.2195},{"bin_left":105,"bin_right":106,"count":2,"percent":1.2195},{"bin_left":106,"bin_right":107,"count":4,"percent":1.2195},{"bin_left":107,"bin_right":108,"count":3,"percent":1.2195},{"bin_left":108,"bin_right":109,"count":3,"percent":1.2195},{"bin_left":109,"bin_right":110,"count":1,"percent":1.2195},{"bin_left":112,"bin_right":113,"count":2,"percent":1.2195},{"bin_left":113,"bin_right":114,"count":2,"percent":1.2195},{"bin_left":114,"bin_right":115,"count":1,"percent":1.2195},{"bin_left":115,"bin_right":116,"count":1,"percent":1.2195},{"bin_left":117,"bin_right":118,"count":2,"percent":1.2195},{"bin_left":118,"bin_right":119,"count":3,"percent":1.2195},{"bin_left":119,"bin_right":120,"count":1,"percent":1.2195},{"bin_left":120,"bin_right":121,"count":1,"percent":1.2195},{"bin_left":121,"bin_right":122,"count":1,"percent":1.2195},{"bin_left":123,"bin_right":124,"count":1,"percent":1.2195},{"bin_left":125,"bin_right":126,"count":1,"percent":1.2195},{"bin_left":126,"bin_right":127,"count":2,"percent":1.2195},{"bin_left":127,"bin_right":128,"count":2,"percent":1.2195}]}];

      function esc(v) {
        if (v === null || v === undefined || v === '') return 'Not provided';
        return String(v)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/\"/g, '&quot;')
          .replace(/'/g, '&#39;');
      }

      function classPill(v) {
        return '<span class="pill">' + esc(v) + '</span>';
      }

      function sendHeight() {
        try {
          var card = document.getElementById('data-card');
          if (!card) return;
          var h = Math.ceil(card.getBoundingClientRect().height);
          parent.postMessage({
            type: 'musky_data_height',
            height: h
          }, '*');
        } catch (e) {}
      }

      function pulseHeight() {
        sendHeight();
        requestAnimationFrame(sendHeight);
        setTimeout(sendHeight, 30);
        setTimeout(sendHeight, 120);
        setTimeout(sendHeight, 250);
      }

      function setEmptyState() {
        document.getElementById('data-empty').style.display = 'block';
        document.getElementById('data-content').classList.remove('active');

        document.getElementById('info-view').classList.remove('active');
        document.getElementById('length-view').classList.remove('active');

        document.getElementById('selected-waterbody').innerHTML = '';
        document.getElementById('length-waterbody').innerHTML = '';
        document.getElementById('data-grid').innerHTML = '';

        document.getElementById('length-btn').style.display = 'none';
        document.getElementById('back-btn').style.display = 'none';

        document.getElementById('length-msg').style.display = 'none';
        document.getElementById('length-chart-host').innerHTML = '';

        pulseHeight();
      }

      function getLengthRecord(waterbody) {
        return MUSKY_LENGTH_DATA.find(d => d.waterbody === waterbody) || null;
      }

      function setData(msg) {
        document.getElementById('data-empty').style.display = 'none';
        document.getElementById('data-content').classList.add('active');

        document.getElementById('info-view').classList.add('active');
        document.getElementById('length-view').classList.remove('active');

        document.getElementById('selected-waterbody').innerHTML = esc(msg.waterbody);
        document.getElementById('length-waterbody').innerHTML = esc(msg.waterbody);

        var html = ''
          + '<div class="data-key">Waterbody</div><div class="data-val">' + esc(msg.waterbody) + '</div>'
          + '<div class="data-key">Management Class</div><div class="data-val">' + classPill(msg.class_value) + '</div>'
          + '<div class="data-key">Regulation</div><div class="data-val">' + esc(msg.regulation) + '</div>'
          + '<div class="data-key">Location</div><div class="data-val">' + esc(msg.location) + '</div>';

        document.getElementById('data-grid').innerHTML = html;
        document.getElementById('length-btn').style.display = 'inline-block';
        document.getElementById('back-btn').style.display = 'inline-block';

        document.getElementById('length-msg').style.display = 'none';
        document.getElementById('length-chart-host').innerHTML = '';

        pulseHeight();
      }

      function renderLengthChart(waterbody) {
        const rec = getLengthRecord(waterbody);
        const msg = document.getElementById('length-msg');
        const host = document.getElementById('length-chart-host');

        host.innerHTML = '';
        msg.style.display = 'none';

        if (!rec || !rec.bins || !rec.bins.length) {
          msg.textContent = 'Length data are not available for this waterbody.';
          msg.style.display = 'block';
          pulseHeight();
          return;
        }

        const bins = rec.bins.slice().sort((a, b) => a.bin_left - b.bin_left);
        const counts = bins.map(d => +d.count || 0);
        const maxCount = Math.max(...counts, 1);
        const minX = Math.min(...bins.map(d => +d.bin_left));
        const maxX = Math.max(...bins.map(d => +d.bin_right));
        const meanVal = +rec.mean;

        const W = 1200;
        const H = 650;
        const margin = { top: 48, right: 120, bottom: 72, left: 70 };
        const innerW = W - margin.left - margin.right;
        const innerH = H - margin.top - margin.bottom;

        function xScale(x) {
          return margin.left + ((x - minX) / (maxX - minX)) * innerW;
        }

        function yScale(y) {
          return margin.top + innerH - (y / maxCount) * innerH;
        }

        const yTicks = [];
        const yStep = maxCount <= 10 ? 1 : 5;
        for (let y = 0; y <= maxCount; y += yStep) yTicks.push(y);
        if (yTicks[yTicks.length - 1] !== maxCount) yTicks.push(maxCount);

        const xTicks = [];
        for (let x = Math.ceil(minX / 10) * 10; x <= maxX; x += 10) xTicks.push(x);

        let svg = '';
        svg += '<svg id="length-chart-svg" viewBox="0 0 ' + W + ' ' + H + '" xmlns="http://www.w3.org/2000/svg">';

        svg += '<rect x="0" y="0" width="' + W + '" height="' + H + '" fill="#ffffff"/>';

        svg += '<text x="' + (margin.left) + '" y="24" font-size="17" font-weight="700" fill="#1d3d77">'
             + 'Length Frequency of Musky - DWR Electrofishing Surveys (2023-2024)'
             + '</text>';

        yTicks.forEach(function(t) {
          const y = yScale(t);
          svg += '<line x1="' + margin.left + '" y1="' + y + '" x2="' + (margin.left + innerW) + '" y2="' + y + '" stroke="#d9d9d9" stroke-width="1"/>';
          svg += '<text x="' + (margin.left - 10) + '" y="' + (y + 4) + '" font-size="12" text-anchor="end" fill="#444">' + t + '</text>';
        });

        xTicks.forEach(function(t) {
          const x = xScale(t);
          svg += '<line x1="' + x + '" y1="' + margin.top + '" x2="' + x + '" y2="' + (margin.top + innerH) + '" stroke="#d9d9d9" stroke-width="1"/>';
          svg += '<text x="' + x + '" y="' + (margin.top + innerH + 22) + '" font-size="12" text-anchor="middle" fill="#444">' + t + '</text>';
        });

        bins.forEach(function(d) {
          const x0 = xScale(+d.bin_left);
          const x1 = xScale(+d.bin_right);
          const y = yScale(+d.count || 0);
          const h = margin.top + innerH - y;
          const barW = Math.max((x1 - x0) - 1, 1);

          svg += '<rect x="' + x0 + '" y="' + y + '" width="' + barW + '" height="' + h + '" fill="#5f88b5" stroke="#444" stroke-width="0.8"/>';
        });

        if (!isNaN(meanVal)) {
          const mx = xScale(meanVal);
          svg += '<line x1="' + mx + '" y1="' + margin.top + '" x2="' + mx + '" y2="' + (margin.top + innerH) + '" stroke="#222" stroke-width="2" stroke-dasharray="8 8"/>';
          svg += '<text x="' + (mx - 38) + '" y="' + (margin.top + 120) + '" font-size="13" fill="#222">Mean: ' + meanVal.toFixed(1) + '</text>';
        }

        svg += '<line x1="' + margin.left + '" y1="' + (margin.top + innerH) + '" x2="' + (margin.left + innerW) + '" y2="' + (margin.top + innerH) + '" stroke="#777" stroke-width="1"/>';
        svg += '<line x1="' + margin.left + '" y1="' + margin.top + '" x2="' + margin.left + '" y2="' + (margin.top + innerH) + '" stroke="#777" stroke-width="1"/>';

        svg += '<text x="' + (margin.left + innerW / 2) + '" y="' + (H - 18) + '" font-size="15" font-weight="700" text-anchor="middle" fill="#111">Length (cm, 1 cm class)</text>';

        svg += '<g transform="translate(20,' + (margin.top + innerH / 2) + ') rotate(-90)">';
        svg += '<text font-size="15" font-weight="700" text-anchor="middle" fill="#111">Count</text>';
        svg += '</g>';

        svg += '</svg>';

        host.innerHTML = svg;
        pulseHeight();
      }

      function showLengthView() {
        const waterbody = document.getElementById('selected-waterbody').textContent;
        if (!waterbody) return;

        document.getElementById('info-view').classList.remove('active');
        document.getElementById('length-view').classList.add('active');

        renderLengthChart(waterbody);
      }

      function showInfoView() {
        document.getElementById('length-view').classList.remove('active');
        document.getElementById('info-view').classList.add('active');
        pulseHeight();
      }

      window.addEventListener('message', function(event) {
        var msg = event.data;
        if (!msg || !msg.type) return;

        if (msg.type === 'musky_waterbody_selected') {
          setData(msg);
        }

        if (msg.type === 'musky_reset_request') {
          setEmptyState();
        }
      });

      document.addEventListener('DOMContentLoaded', function() {
        var card = document.getElementById('data-card');
        var btn = document.getElementById('length-btn');
        var backBtn = document.getElementById('back-btn');

        if (btn) {
          btn.addEventListener('click', function(e) {
            e.preventDefault();
            showLengthView();
          });
        }

        if (backBtn) {
          backBtn.addEventListener('click', function(e) {
            e.preventDefault();
            showInfoView();
          });
        }

        if ('ResizeObserver' in window && card) {
          var ro = new ResizeObserver(function() {
            sendHeight();
          });
          ro.observe(card);
        }

        setEmptyState();
        window.addEventListener('load', pulseHeight);
        window.addEventListener('resize', pulseHeight);
      });
    </script>
</head>
<html>
  <body>
    <div id="data-wrap">
      <div id="data-card">
        <div id="data-title">Selected Waterbody Information</div>
        <div id="data-empty">Select a managed waterbody from the map or navigation panel to view its details here.</div>
        <div id="data-content">
          <div id="info-view" class="panel-view">
            <div id="selected-row">
              <div id="selected-waterbody"></div>
              <button id="length-btn" type="button">View Fish Length Data</button>
            </div>
            <div id="data-grid" class="data-grid"></div>
          </div>
          <div id="length-view" class="panel-view">
            <div id="length-top-row">
              <div id="length-waterbody"></div>
              <button id="back-btn" type="button">Back to Waterbody Info</button>
            </div>
            <div id="length-wrap">
              <div id="length-chart-title">Length Data</div>
              <div id="length-msg"></div>
              <div id="length-chart-host"></div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
