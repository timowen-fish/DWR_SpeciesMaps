<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<style>body{background-color:transparent;}</style>

  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Muskellunge Data Panel</title>
  <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        background: transparent;
        font-family: Arial, sans-serif;
        overflow-x: hidden;
      }

      * { box-sizing: border-box; }

      #data-wrap {
        width: 100%;
        padding: 0;
      }

      #data-card {
        background: rgba(255,255,255,0.96);
        border-top: 1px solid #d9e2ea;
        box-shadow: 0 -1px 6px rgba(0,0,0,0.05);
        padding: 10px 12px;
        width: 100%;
      }

      #data-title {
        font-size: 15px;
        font-weight: 700;
        color: #24507f;
        margin: 0 0 8px 0;
      }

      #data-empty {
        color: #5d6f81;
        font-size: 13px;
        line-height: 1.4;
        padding: 4px 0 2px 0;
      }

      #data-content {
        display: none;
      }

      #data-content.active {
        display: block;
      }

      #selected-waterbody {
        font-size: 18px;
        font-weight: 700;
        color: #1f3f73;
        margin: 0 0 8px 0;
        line-height: 1.15;
      }

      .data-grid {
        display: grid;
        grid-template-columns: 160px 1fr;
        gap: 0;
        border: 1px solid #dbe6ef;
        border-radius: 6px;
        overflow: hidden;
        background: #fff;
      }

      .data-key,
      .data-val {
        padding: 8px 10px;
        font-size: 13px;
        line-height: 1.35;
        border-bottom: 1px solid #e8eef4;
      }

      .data-key {
        font-weight: 700;
        color: #355372;
        background: #f6f9fc;
        border-right: 1px solid #e8eef4;
      }

      .data-val {
        color: #32485d;
        background: #ffffff;
        word-break: break-word;
      }

      .data-grid > div:nth-last-child(-n+2) {
        border-bottom: none;
      }

      .pill {
        display: inline-block;
        padding: 4px 8px;
        border-radius: 999px;
        font-size: 12px;
        font-weight: 700;
        background: #eef5fb;
        color: #24507f;
        border: 1px solid #d4e4f2;
      }

      @media (max-width: 700px) {
        #data-card {
          padding: 9px 10px 10px 10px;
        }

        #data-title {
          font-size: 14px;
          margin-bottom: 7px;
        }

        #selected-waterbody {
          font-size: 17px;
          margin-bottom: 7px;
        }

        .data-grid {
          grid-template-columns: 1fr;
          border-radius: 4px;
        }

        .data-key {
          border-right: none;
          border-bottom: none;
          padding-bottom: 4px;
        }

        .data-val {
          padding-top: 0;
        }
      }
    </style>
  <script>
      function esc(v) {
        if (v === null || v === undefined || v === '') return 'Not provided';
        return String(v)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#39;');
      }

      function classPill(v) {
        return '<span class="pill">' + esc(v) + '</span>';
      }

      function sendHeight() {
        try {
          var card = document.getElementById('data-card');
          if (!card) return;
          var h = Math.ceil(card.getBoundingClientRect().height);
          parent.postMessage({
            type: 'musky_data_height',
            height: h
          }, '*');
        } catch (e) {}
      }

      function pulseHeight() {
        sendHeight();
        requestAnimationFrame(sendHeight);
        setTimeout(sendHeight, 30);
        setTimeout(sendHeight, 120);
        setTimeout(sendHeight, 250);
      }

      function setEmptyState() {
        document.getElementById('data-empty').style.display = 'block';
        document.getElementById('data-content').classList.remove('active');
        document.getElementById('selected-waterbody').innerHTML = '';
        document.getElementById('data-grid').innerHTML = '';
        pulseHeight();
      }

      function setData(msg) {
        document.getElementById('data-empty').style.display = 'none';
        document.getElementById('data-content').classList.add('active');
        document.getElementById('selected-waterbody').innerHTML = esc(msg.waterbody);

        var html = ''
          + '<div class="data-key">Waterbody</div><div class="data-val">' + esc(msg.waterbody) + '</div>'
          + '<div class="data-key">Class</div><div class="data-val">' + classPill(msg.class_value) + '</div>'
          + '<div class="data-key">Regulation</div><div class="data-val">' + esc(msg.regulation) + '</div>'
          + '<div class="data-key">Location</div><div class="data-val">' + esc(msg.location) + '</div>';

        document.getElementById('data-grid').innerHTML = html;
        pulseHeight();
      }

      window.addEventListener('message', function(event) {
        var msg = event.data;
        if (!msg || !msg.type) return;

        if (msg.type === 'musky_waterbody_selected') {
          setData(msg);
        }

        if (msg.type === 'musky_reset_request') {
          setEmptyState();
        }
      });

      document.addEventListener('DOMContentLoaded', function() {
        var card = document.getElementById('data-card');
        if ('ResizeObserver' in window && card) {
          var ro = new ResizeObserver(function() {
            sendHeight();
          });
          ro.observe(card);
        }
        setEmptyState();
        window.addEventListener('load', pulseHeight);
        window.addEventListener('resize', pulseHeight);
      });
    </script>
</head>
<html>
  <body>
    <div id="data-wrap">
      <div id="data-card">
        <div id="data-title">Selected Waterbody Information</div>
        <div id="data-empty">Select a management waterbody from the map or legend to view its details here.</div>
        <div id="data-content">
          <div id="selected-waterbody"></div>
          <div id="data-grid" class="data-grid"></div>
        </div>
      </div>
    </div>
  </body>
</html>
</html>
